# =====================================================================================================
# deploy/compose.yml — AIRGAPPED RUNTIME (PLAN §10.2; Appendix C document 1).
#
# Scope today: db, mcp, rerank (TEI, profile rerank) and lgx-streamlit (profile testui). Still to come from
# Appendix C: proxy (Caddy basic auth on :8443 in front of lgx-streamlit), webui, egress-sentinel, lgx-ctl,
# prometheus, db-bm25, oxigraph. Until the proxy exists, lgx-streamlit here has no published port (by design:
# Streamlit has no authentication and must only be reached through Caddy in the airgap).
#
#   docker compose -f compose.yml --profile testui up -d     (after scripts/airgap_import.sh install, docs/ANLEITUNG.md §7)
#   + the OPTIONAL reranker (off by default; the only non-Mistral model): --profile rerank together with
#     LGX_RERANK=auto and LGX_RERANK_URL=http://rerank:8080 in deploy/.env (airgap_import.sh --with-rerank writes both)
#   compose.localhost.yml (override): publishes Streamlit and MCP on 127.0.0.1 of the host until the proxy exists
# For the connected dev host use compose.dev.yml (standalone, dev defaults, 127.0.0.1 ports).
#
# No LLM runtime is bundled (user decision 2026-10-17): the chat LLM and, when enabled, the query embeddings are the
# user's on-prem Mistral endpoint (same API as Mistral SaaS, another domain) — OPENAI_BASE_URL / LGX_LLM_MODEL and
# LGX_EMBED_BASE_URL in deploy/.env. lgx-streamlit and mcp reach it over `enclave`, the only routed network next to
# the proxy's `edge`; the DOCKER-USER rule admits NEW connections from br-lgx-encl only to LGX_MISTRAL_IP:443 and
# drops everything else. The airgap has no upstream DNS: the domain resolves through extra_hosts
# (LGX_MISTRAL_HOST -> LGX_MISTRAL_IP) or the enclave's own resolver.
#
# Conventions (Appendix C): images lgx.local/<name>:<tag> loaded from the signed platform bundle and verified by
# image ID (pins in images.lock); pull_policy never; networks backend/front are internal, edge and enclave are the
# only networks with a gateway.
# Secrets are files under ${LGX_HOME}/secrets written by `lgx install` (M5). Outside Swarm a compose secret is a
# plain bind mount that keeps the host owner and mode (long-syntax uid/gid/mode are ignored), and mcp /
# lgx-streamlit run as 10001:10001 with cap_drop ALL, so ownership is part of the contract (tests/unit/
# test_ui_compose.py checks this table against the services):
#   pg_superuser_pw  root:root   0600   db (the postgres entrypoint reads it as root)
#   pg_ro_pw         10001:10001 0400   mcp
#   mcp_token        10001:10001 0400   mcp, lgx-streamlit
#   embed_api_key    10001:10001 0400   mcp            (empty file = no key: vector_status disabled:no_api_key)
#   llm_api_key      10001:10001 0400   lgx-streamlit
# e.g. install -o 10001 -g 10001 -m 0400 /dev/stdin "${LGX_HOME}/secrets/mcp_token" <<< "$TOKEN". A secret that
# uid 10001 cannot read stops mcp (SettingsError) and lgx-streamlit (UiSettingsError) at start.
# =====================================================================================================
name: legilux

x-base: &base
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512
  logging: { driver: local, options: { max-size: "50m", max-file: "5" } }

x-offline-env: &offline
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TRANSFORMERS_OFFLINE: "1"
  DO_NOT_TRACK: "1"
  NO_PROXY: "*"

x-mistral-host: &mistral_host ["${LGX_MISTRAL_HOST:-mistral.invalid}:${LGX_MISTRAL_IP:-192.0.2.10}"]

networks:
  backend:
    internal: true
    driver_opts: { com.docker.network.bridge.name: br-lgx-back }
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  front:
    internal: true
    driver_opts: { com.docker.network.bridge.name: br-lgx-front }
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }
  edge:
    driver_opts: { com.docker.network.bridge.name: br-lgx-edge }
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  enclave:                                              # routed: only to the on-prem Mistral endpoint (DOCKER-USER)
    driver_opts: { com.docker.network.bridge.name: br-lgx-encl }
    ipam: { config: [{ subnet: 172.30.3.0/24 }] }

volumes:
  pgdata: {}
  audit: {}

secrets:
  pg_superuser_pw: { file: "${LGX_HOME:-/opt/legilux}/secrets/pg_superuser_pw" }
  pg_ro_pw: { file: "${LGX_HOME:-/opt/legilux}/secrets/pg_ro_pw" }
  mcp_token: { file: "${LGX_HOME:-/opt/legilux}/secrets/mcp_token" }
  embed_api_key: { file: "${LGX_HOME:-/opt/legilux}/secrets/embed_api_key" }
  llm_api_key: { file: "${LGX_HOME:-/opt/legilux}/secrets/llm_api_key" }

# No compose `configs` with inline content: compose copies them into the container, which fails for read_only
# services such as lgx-streamlit ("`file` is the sole supported option"; Appendix C's streamlit_config). The offline
# config.toml is baked into the image (ui/.streamlit/config.toml); the per-host values are STREAMLIT_* variables.

services:
  db:
    <<: *base
    image: lgx.local/lgx-db:18-0.8.7-${LGX_PLATFORM:-2026.10.0}
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]          # [U] minimal set, tested in M5
    shm_size: 1g
    environment: { POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_pw }
    secrets: [pg_superuser_pw]
    volumes: ["pgdata:/var/lib/postgresql"]
    command: ["postgres", "-c", "shared_buffers=${LGX_PG_SHARED_BUFFERS:-2GB}", "-c", "effective_cache_size=6GB",
              "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=4",
              "-c", "password_encryption=scram-sha-256", "-c", "listen_addresses=*"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 30 }
    networks: [backend]
    mem_limit: ${LGX_PG_MEM:-8g}

  mcp:
    <<: *base
    image: lgx.local/lgx-mcp:${LGX_PLATFORM:-2026.10.0}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *offline
      LGX_DB_HOST: db
      LGX_DB_NAME: legilux
      LGX_DB_USER: lgx_ro
      LGX_DB_PASSWORD_FILE: /run/secrets/pg_ro_pw
      LGX_MCP_TOKEN_FILE: /run/secrets/mcp_token
      LGX_ALLOWED_HOSTS: "mcp:8000,localhost:8000"
      LGX_ALLOWED_ORIGINS: "https://${LGX_HOSTNAME:-legilux.intra},https://${LGX_HOSTNAME:-legilux.intra}:8443"
      LGX_RERANK_URL: "${LGX_RERANK_URL:-}"             # http://rerank:8080 with the rerank profile (deploy/.env, lgx install)
      LGX_RERANK: "${LGX_RERANK:-off}"                  # OFF by default (optional); auto (+ profile rerank): unavailable -> unreranked + reason | on
      # CPU-safe defaults (M2 review, PLAN §8.3): the pinned fp32 model needs ≈ 17-20 s for 16 x 600 characters on 4
      # vCPU; 40 x 1,800 (≈ 150 s on 4 vCPU, ≈ 37 s on 16 cores) needs a GPU or the int8 ONNX export (ADR 0001)
      LGX_RERANK_K: "${LGX_RERANK_K:-16}"
      LGX_RERANK_BATCH: "32"                            # client-side split, <= TEI --max-client-batch-size (defence in depth)
      LGX_RERANK_BODY_CHARS: "${LGX_RERANK_BODY_CHARS:-600}"   # body cut per candidate
      # TOTAL rerank budget of one search (all batches; past it: lexical order + reason, LGX_RERANK=auto). Keep it
      # below the UI's LGX_MCP_TIMEOUT_S (lgx-streamlit, 45 s) minus SQL time and a margin; the startup probe times
      # k x body-chars texts and reports a reranker slower than the budget as unavailable (« too slow … »)
      LGX_RERANK_TIMEOUT_S: "${LGX_RERANK_TIMEOUT_S:-20}"
      LGX_RETRIEVAL_MODE_DEFAULT: auto
      LGX_EMBED_PROVIDER: "${LGX_EMBED_PROVIDER:-none}"   # none (default) | mistral: query embeddings, startup probe
      LGX_EMBED_BASE_URL: "${LGX_EMBED_BASE_URL:-https://mistral.invalid}"   # the on-prem domain (no /v1)
      LGX_EMBED_MODEL: "${LGX_EMBED_MODEL:-mistral-embed}"   # the reported id must equal lgx.embedding_model.model_id
      LGX_EMBED_API_KEY_FILE: /run/secrets/embed_api_key
      LGX_EMBED_MAX_CONCURRENCY: "${LGX_EMBED_MAX_CONCURRENCY:-5}"   # throttle (config/embedding.yaml)
      LGX_EMBED_COOLDOWN_S: "${LGX_EMBED_COOLDOWN_S:-20}"
      LGX_EMBED_TIMEOUT_S: "5"                          # a query waits at most this long, then runs lexical
      LGX_TZ: Europe/Luxembourg
      LGX_STALENESS_WARN_DAYS: "30"
      LGX_STALENESS_CRITICAL_DAYS: "90"
      LGX_MAX_RESULT_TOKENS: "${LGX_MAX_RESULT_TOKENS:-4000}"
      LGX_AUDIT_QUERY_TEXT: "false"
      LGX_TRUSTED_PROXIES: "${LGX_TRUSTED_PROXIES:-}"   # IP/CIDR of Open WebUI: its user headers key rate limit + audit
    secrets: [pg_ro_pw, mcp_token, embed_api_key]
    extra_hosts: *mistral_host
    volumes: ["audit:/var/log/lgx"]
    depends_on:
      db: { condition: service_healthy }
      rerank: { condition: service_started, required: false }   # only when the rerank profile is active
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      retries: 20
    networks: [backend, enclave]                        # enclave: query embeddings (only with provider mistral)

  rerank:                                               # TEI cross-encoder (PLAN §8.3 step 3; Appendix C). Profile rerank:
    <<: *base                                           # opt-in until lgx install writes COMPOSE_PROFILES (M5)
    profiles: [rerank]
    image: lgx.local/tei:cpu-1.9.4                      # text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c… (images.lock)
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp", "/data"]
    environment:
      <<: *offline
      RAYON_NUM_THREADS: "${LGX_RERANK_THREADS:-8}"     # image default 8; set to the cores reserved for reranking
    # Model directory from the models bundle (deploy/models.lock, scripts/fetch_models.sh --verify-only).
    # --max-client-batch-size 64 >= LGX_RERANK_BATCH and >= LGX_RERANK_K (TEI's default 32 rejects 40 candidates [V]);
    # --max-batch-tokens 4096: one pair <= 4,096 tokens (auto-truncate), CPU warm-up 1.7 min instead of 9 min.
    command: ["--model-id", "/models/hf/bge-reranker-v2-m3@953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e", "--port", "8080",
              "--max-client-batch-size", "64", "--max-batch-tokens", "4096", "--auto-truncate", "true"]
    volumes: ["${LGX_HOME:-/opt/legilux}/models/hf:/models/hf:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]   # curl ships in the image [V]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    networks: [backend]

  lgx-streamlit:                                        # tester UI (profile testui): chat + direct search + eval + corpus
    <<: *base
    profiles: [testui]
    image: lgx.local/lgx-streamlit:${LGX_PLATFORM:-2026.10.0}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *offline
      OPENAI_BASE_URL: "${LGX_LLM_BASE_URL:-https://mistral.invalid/v1}"   # the user's on-prem Mistral endpoint
      OPENAI_API_KEY_FILE: /run/secrets/llm_api_key
      LGX_LLM_MODEL: "${LGX_LLM_MODEL:-mistral-small-latest}"   # [U] the model the endpoint serves
      LGX_MCP_URL: http://mcp:8000/mcp
      LGX_MCP_TOKEN_FILE: /run/secrets/mcp_token
      LGX_MAX_TOOL_ITERATIONS: "5"
      LGX_MCP_TIMEOUT_S: "${LGX_MCP_TIMEOUT_S:-45}"     # per tool call; > mcp LGX_RERANK_TIMEOUT_S (20) + SQL + margin
      LGX_LLM_TIMEOUT_S: "${LGX_LLM_TIMEOUT_S:-120}"
      LGX_TURN_BUDGET_S: "${LGX_TURN_BUDGET_S:-600}"
      LGX_TOOL_RESULT_TOKENS: "${LGX_TOOL_RESULT_TOKENS:-4000}"
      LGX_EVAL_DIR: /data/eval
      LGX_HOSTNAME: "${LGX_HOSTNAME:-legilux.intra}"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_BROWSER_SERVER_ADDRESS: "${LGX_HOSTNAME:-legilux.intra}"
      STREAMLIT_LOGGER_HIDE_WELCOME_MESSAGE: "true"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "none"
    secrets: [mcp_token, llm_api_key]
    extra_hosts: *mistral_host
    volumes: ["${LGX_HOME:-/opt/legilux}/bundles/current/eval:/data/eval:ro"]
    depends_on: { mcp: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      retries: 10
    networks: [backend, front, enclave]                 # users reach it through the proxy (Caddy); enclave: the LLM
