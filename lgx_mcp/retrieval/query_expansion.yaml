# Server-side query preparation for the lexical branch of search_legislation (PLAN §8.3, R9; M2).
#
# status: draft_unvalidated — curated by the developer from general legal vocabulary (not from the gold
# questions); lawyer review pending, like config/aliases.yaml. Offline: read from the image, never fetched.
# An operator copy at $LGX_CONFIG_DIR/query_expansion.yaml replaces this file.
#
# noise      words removed from the lexical query before stemming (interrogatives and framing words that the
#            French snowball stemmer keeps and that would get a high IDF: « quel » occurs in 121 of 10,220 sample
#            chunks). Matched per token after folding (lower case, no accents, ’ -> ').
# expansions when a trigger occurs in the folded query (whole words), its French terms are added to the lexical
#            query with a lower weight (lgx.search_candidates p_expansion, opts.expansion_weight). `lang` says which
#            question language the trigger belongs to: fr = French synonym or official wording, de / en = glossary for
#            German / English questions the LLM did not reformulate (the tool description asks it to).
version: 1
status: draft_unvalidated
noise:
  fr: [quel, quelle, quels, quelles, comment, combien, pourquoi, selon, prevoit, prevoient, dit, existe, existe-t-il,
       faut-il, peut-on, puis-je, dois-je, doit-on, ai-je, a-t-on, y-a-t-il, est-ce, "qu'est-ce", quoi, explique,
       expliquer, "s'applique-t-il", "s'applique-t-elle", sont-ils, sont-elles, est-il, est-elle]
  de: [was, wie, welche, welcher, welches, wann, wer, wo, warum, gibt, es, regelt, sagt, laut, nach, gem, gemass, des,
       der, die, das, dem, den, ein, eine, einer, ist, sind, im, in, an, am, auf, bei, fur, mit, von, zu, und, oder,
       muss, kann, darf, luxemburg, luxemburger, luxemburgischen, luxemburgischem, recht, gesetz]
  en: [what, which, how, when, who, where, why, does, do, is, are, the, a, an, of, in, "on", at, by, for, to, under,
       according, and, or, can, may, must, my, luxembourg, luxembourgish, law, rules, say, says]
