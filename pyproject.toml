[project]
name = "legilux-local-clone"
version = "0.1.0"
description = "Airgap-deployable local clone of current Luxembourg legislation (Legilux), served over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LegiLux Local Clone contributors" }]
# Core: used by lgx_core (shared legal logic), the lgx CLI and the database layer.
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
    "httpx>=0.28.1,<1",
    "typer>=0.27.2",
    "rich>=14.0",
    "psycopg[binary]>=3.3.6,<4",
    "psycopg-pool>=3.3.2,<4",
]

[project.optional-dependencies]
# Build zone: SPARQL snapshots (parquet), AKN/HTML parsing, PDF codes (M2).
ingest = [
    "lxml>=6.1.3,<7",
    "pyarrow>=25.0.1,<26", # streamlit 1.65.0 requires pyarrow <26, !=25.0.0
    "pdfplumber>=0.11.10",
]
# Runtime MCP server (PLAN §8, D9). 2.3.0 serves both protocol eras.
mcp = ["mcp==2.3.0"]
# Streamlit tester UI (PLAN §9.3, M1b).
ui = [
    "streamlit==1.65.0",
    "openai==3.24.0",
    "mcp==2.3.0",
]

[project.scripts]
lgx = "lgx_ingest.cli:app"

[dependency-groups]
# `uv sync` installs this group by default, so a fresh checkout gets every extra + test tooling.
dev = [
    "legilux-local-clone[ingest,mcp,ui]",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "jsonschema>=4.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lgx_core", "lgx_ingest", "lgx_mcp", "ui/lgx_ui"]

[tool.uv]
# Supply-chain hygiene: resolve only releases published at least 14 calendar days before the
# M0 date (2026-10-16). Bump deliberately, never to a release younger than 14 days.
exclude-newer = "2026-10-03T00:00:00Z"
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/plan", "docs/research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]
# French legal text legitimately contains « », ’ and non-breaking spaces.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["lgx_core", "lgx_ingest", "lgx_mcp", "lgx_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real Legilux endpoints (skipped unless --run-live or LGX_RUN_LIVE=1)",
    "db: needs PostgreSQL (Docker or LGX_TEST_PG_DSN); skipped when neither is available",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
