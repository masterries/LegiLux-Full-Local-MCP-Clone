# =====================================================================================================
# Appendix C — docker-compose sketch for the LegiLux local clone (see PLAN.md §5, §9, §10)
#
# This file holds SIX compose documents separated by `---`. In the repository they are six files:
#   1. deploy/compose.yml          AIRGAPPED RUNTIME (also the base of the dev stack)
#   2. deploy/compose.dev.yml      overlay for the CONNECTED dev/test host (Streamlit on 127.0.0.1, opt-in cloud LLM)
#   3. deploy/compose.build.yml    CONNECTED BUILD host (ingester + build Postgres + opt-in embedder; no GPU required)
#   4. deploy/compose.audit.yml    overlay used by `lgx audit-egress`: every service resolves through the DNS sentinel
#   5. deploy/compose.enclave.yml  overlay for placement (ii): the user's Mistral on-prem endpoint on an enclave host
#   6. deploy/compose.gpu48.yml    overlay for the gpu48 profile: TEI GPU image + GPU reservation for `rerank`
# Validation (Docker Compose v5.6.0, 2026-10-16, after the review revision): `docker compose config -q` passes for
# document 1 alone and for documents 2, 4, 5 and 6 each merged on top of it, with every profile combination listed in
# PLAN.md §10.2; document 3 passes alone; the service sets per profile were checked (PLAN.md Appendix E, P5, P10).
#
# Conventions
#  - Images are referenced as lgx.local/<name>:<tag>. `lgx install` loads them from the signed platform bundle,
#    verifies each image ID against release.json, then tags them (docker save/load may drop repo digests [U]).
#    Upstream pins (tag@digest) are in deploy/images.lock and PLAN.md §10.1.
#  - pull_policy: never everywhere. Networks: `backend` (internal; data, MCP, models), `front` (internal; UIs <-> proxy)
#    and `edge` (the only network with a gateway, needed for published ports; only the proxy, plus egress-sentinel during
#    audits, is on it). Every bridge is
#    also covered by the DOCKER-USER rules below.
#  - Host paths hang off ${LGX_HOME:-/opt/legilux}. `lgx install` uses /opt/legilux; `lgx dev-init` writes deploy/.env
#    with LGX_HOME=./.dev (resolved against deploy/), so the dev stack needs no root-owned paths.
#  - deploy/.env is written by `lgx install` / `lgx dev-init`: LGX_HOSTNAME, LGX_BIND_ADDR, LGX_TESTUI_BCRYPT (always,
#    single-quoted because bcrypt hashes contain `$`), LGX_CTX / LGX_RERANK_K / LGX_LLM_MODEL per profile, LGX_TEI_TAG.
#  - Profiles: cpu | gpu24 | gpu48 (exactly one LLM runtime; gpu48 also needs compose.gpu48.yml), testui (Streamlit),
#    webui (Open WebUI), audit (DNS sentinel), jobs (lgx-ctl), embed-local (operator-supplied Mistral on-prem embedder),
#    observability (Prometheus), bm25-agpl (ParadeDB bake-off, AGPL), rdf (Oxigraph sidecar).
#  - Never invent the Mistral on-prem image: it is supplied by the operator under their Mistral licence.
# =====================================================================================================
name: legilux

x-base: &base
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512
  logging: { driver: local, options: { max-size: "50m", max-file: "5" } }

x-offline-env: &offline
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TRANSFORMERS_OFFLINE: "1"
  DO_NOT_TRACK: "1"
  NO_PROXY: "*"

x-ollama-env: &ollama_env
  <<: *offline
  OLLAMA_NO_CLOUD: "1"                                  # disables cloud features [V]
  OLLAMA_CONTEXT_LENGTH: "${LGX_CTX:-32768}"            # always set: Ollama's default depends on VRAM (4k below 24 GiB) [V]
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_NUM_PARALLEL: "${LGX_LLM_PARALLEL:-2}"
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_MODELS: /models/ollama

x-ollama: &ollama
  <<: *base
  image: lgx.local/ollama:0.40.5                       # ollama/ollama:0.40.5@sha256:5d3a2f25…
  environment: *ollama_env
  volumes: ["ollama-models:/models/ollama"]             # filled from the models-<profile> bundle at install / dev-init
  networks: { backend: { aliases: [llm] } }
  healthcheck: { test: ["CMD", "ollama", "list"], interval: 30s, retries: 10 }

# Host firewall (installed by `lgx install`, re-applied by systemd unit lgx-firewall.service after every
# Docker restart; removed only with `lgx uninstall --i-know`). Bridges get fixed names below.
# NEW connections opened by containers are dropped; inbound users and their replies still work.
x-docker-user-rules: |
  -I DOCKER-USER -i br-lgx-edge ! -o br-lgx-edge -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
  -I DOCKER-USER -i br-lgx-front ! -o br-lgx-front -j DROP
  -I DOCKER-USER -i br-lgx-back ! -o br-lgx-back -j DROP
  # Placement (ii) only (Mistral on-prem embedder/LLM on an enclave host): backend and front have no gateway, so
  # compose.enclave.yml also attaches mcp / lgx-streamlit to `edge`, and this ACCEPT is inserted last (= evaluated first):
  # -I DOCKER-USER -i br-lgx-edge -d $${LGX_ENCLAVE_IP}/32 -p tcp --dport $${LGX_ENCLAVE_PORT} -j ACCEPT
  # The egress gate then becomes "0 packets to non-allow-listed destinations". Placement (i) (embed-local) is preferred.

networks:
  backend:
    internal: true                                      # no gateway, no route out
    driver_opts: { com.docker.network.bridge.name: br-lgx-back }
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  front:                                                # UIs <-> proxy only; no gateway
    internal: true
    driver_opts: { com.docker.network.bridge.name: br-lgx-front }
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }
  edge:                                                 # only network with a gateway (published ports need one); proxy (+ sentinel)
    driver_opts: { com.docker.network.bridge.name: br-lgx-edge }
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }

volumes:
  pgdata: {}
  ollama-models: {}
  owui-data: {}
  caddy-data: {}
  audit: {}
  sentinel-log: {}
  prom-data: {}
  oxigraph-data: {}

secrets:                                               # 0600 files (openssl rand -hex 32) from `lgx install` / `lgx dev-init`
  pg_superuser_pw: { file: "${LGX_HOME:-/opt/legilux}/secrets/pg_superuser_pw" }
  pg_ro_pw:        { file: "${LGX_HOME:-/opt/legilux}/secrets/pg_ro_pw" }
  mcp_token:       { file: "${LGX_HOME:-/opt/legilux}/secrets/mcp_token" }
  llm_api_key:     { file: "${LGX_HOME:-/opt/legilux}/secrets/llm_api_key" }   # local endpoints ignore it; on-prem Mistral may need it

configs:
  caddyfile:                                            # CI runs `caddy validate` on it for testui, webui and testui+webui
    content: |
      {
        admin localhost:2019
        skip_install_trust
        auto_https disable_redirects
      }
      # end-user chat (optional Open WebUI; 502 if the webui profile is off)
      https://{$$LGX_HOSTNAME} {
        tls internal
        encode zstd gzip
        reverse_proxy webui:8080
      }
      # tester UI: Streamlit has no authentication of its own (502 if the testui profile is off)
      https://{$$LGX_HOSTNAME}:8443 {
        tls internal
        basic_auth {
          {$$LGX_TESTUI_USER} {$$LGX_TESTUI_BCRYPT}
        }
        reverse_proxy lgx-streamlit:8501
      }
  corefile:                                             # egress sentinel: log + NXDOMAIN for every name [U syntax, M5]
    content: |
      . {
        log
        template ANY ANY {
          rcode NXDOMAIN
        }
      }
  streamlit_config:                                     # keys verified in the streamlit 1.65.0 wheel (J5, P10)
    content: |
      [browser]
      gatherUsageStats = false
      serverAddress = "${LGX_HOSTNAME:-legilux.intra}"
      [server]
      headless = true
      fileWatcherType = "none"
      enableXsrfProtection = true
      enableStaticServing = false
      [logger]
      # headless=true alone makes 1.65.0 GET checkip.amazonaws.com at startup (net_util.get_external_ip) [V]
      hideWelcomeMessage = true
      [client]
      toolbarMode = "minimal"
      showErrorDetails = false
      [global]
      developmentMode = false
      # no [theme] font URLs; the app never uses st.map / pydeck / remote st.image

services:
  # ------------------------------------------------------------------------------------------ data
  db:
    <<: *base
    image: lgx.local/lgx-db:18-0.8.7-${LGX_PLATFORM:-2026.10.0}   # FROM pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c9302…
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]          # [U] minimal set, tested in M5
    shm_size: 1g
    environment: { POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_pw }
    secrets: [pg_superuser_pw]
    volumes: ["pgdata:/var/lib/postgresql"]                         # PG18: PGDATA=/var/lib/postgresql/18/docker [V]
    command: ["postgres", "-c", "shared_buffers=${LGX_PG_SHARED_BUFFERS:-2GB}", "-c", "effective_cache_size=6GB",
              "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=4",
              "-c", "password_encryption=scram-sha-256", "-c", "listen_addresses=*"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 30 }
    networks: [backend]
    mem_limit: ${LGX_PG_MEM:-8g}

  # ------------------------------------------------------------------------------------------ MCP + retrieval
  mcp:
    <<: *base
    image: lgx.local/lgx-mcp:${LGX_PLATFORM:-2026.10.0}             # FROM python:3.13.16-slim-trixie@sha256:70729b46…
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *offline
      LGX_DB_HOST: db
      LGX_DB_NAME: legilux                              # rename-swap target; previous release kept as legilux_prev_<T>
      LGX_DB_USER: lgx_ro
      LGX_DB_PASSWORD_FILE: /run/secrets/pg_ro_pw
      LGX_MCP_TOKEN_FILE: /run/secrets/mcp_token
      LGX_ALLOWED_HOSTS: "mcp:8000,localhost:8000"      # /mcp only; /livez and /readyz are exempt (PLAN §8.1)
      LGX_ALLOWED_ORIGINS: "https://${LGX_HOSTNAME:-legilux.intra},https://${LGX_HOSTNAME:-legilux.intra}:8443"
      LGX_RERANK_URL: http://rerank:8080
      LGX_RERANK: "${LGX_RERANK:-auto}"                 # auto (unavailable -> unreranked + reason) | on (-> BACKEND_UNAVAILABLE) | off
      LGX_RERANK_K: "${LGX_RERANK_K:-40}"               # cpu profile: 16 (written to .env by lgx install)
      LGX_RERANK_BATCH: "32"                            # client-side split, <= TEI --max-client-batch-size (defence in depth)
      LGX_RETRIEVAL_MODE_DEFAULT: auto                  # auto|lexical|hybrid; auto = hybrid only if vector_status=ok
      LGX_EMBED_PROVIDER: "${LGX_EMBED_PROVIDER:-none}" # none (default) | mistral-local | openai-compatible | tei
      LGX_EMBED_URL: "${LGX_EMBED_URL:-}"               # e.g. http://embed-local:<port>/v1/embeddings (operator)
      LGX_EMBED_MODEL: "${LGX_EMBED_MODEL:-}"           # must match lgx.embedding_model.model_id (or an alias)
      LGX_EMBED_TIMEOUT_S: "5"
      LGX_EMBED_REPROBE_MIN: "60"                       # parity re-probe while vector_status=ok (15 min while disabled)
      LGX_TZ: Europe/Luxembourg
      LGX_STALENESS_WARN_DAYS: "30"
      LGX_STALENESS_CRITICAL_DAYS: "90"
      LGX_MAX_RESULT_TOKENS: "${LGX_MAX_RESULT_TOKENS:-4000}"   # estimated as ceil(chars / 3.5); no tokenizer at runtime
      LGX_AUDIT_QUERY_TEXT: "false"                     # hashes only by default (OD14)
    secrets: [pg_ro_pw, mcp_token]
    volumes: ["audit:/var/log/lgx"]
    depends_on: { db: { condition: service_healthy }, rerank: { condition: service_started } }
    healthcheck:                                        # /readyz: 200 iff DB reachable + schema supported; degraded states in the body
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      retries: 20
    networks: [backend]

  rerank:                                               # cpu and gpu24 run TEI cpu; gpu48 swaps image + GPU via compose.gpu48.yml
    <<: *base
    image: lgx.local/tei:cpu-1.9.4                      # text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c…
    read_only: true
    tmpfs: ["/tmp", "/data"]
    environment: { <<: *offline }
    command: ["--model-id", "/models/hf/bge-reranker-v2-m3@953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e", "--port", "8080",
              "--max-client-batch-size", "64"]          # TEI default 32 would reject the 40-candidate /rerank calls [V]
    volumes: ["${LGX_HOME:-/opt/legilux}/models/hf:/models/hf:ro"]
    networks: [backend]

  embed-local:                                          # placement (i) for the user's Mistral on-prem embedder (OD2)
    <<: *base
    profiles: [embed-local]
    image: ${LGX_MISTRAL_EMBED_IMAGE:-lgx.local/operator-supplied-embedder:unset}   # loaded from the operator's own media
    environment: { <<: *offline }
    # command / ports / model volume: as documented by the vendor under the user's licence (not invented here).
    networks: [backend]

  # ------------------------------------------------------------------------------------------ LLM runtimes (one per profile)
  llm-cpu:                                              # TEST FIRST: gemma4:26b-a4b (≈ 18.7 GB); dev fallback ministral-3:8b (6.0 GB)
    <<: *ollama
    profiles: [cpu]
    environment: { <<: *ollama_env, OLLAMA_CONTEXT_LENGTH: "${LGX_CTX:-16384}" }   # PLAN §9.1: 16k on cpu
  llm-gpu:                                              # gpu24 default: qwen3.8:27b-q4_K_M (18 GB), 32k context
    <<: *ollama
    profiles: [gpu24]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  llm-vllm:                                             # gpu48+: Qwen3.8-27B-FP8 @017b9c7a…
    <<: *base
    profiles: [gpu48]
    image: lgx.local/vllm-openai:${LGX_VLLM_TAG:-v0.31.0}  # vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd… (-cu129 for pre-CUDA-13 drivers)
    shm_size: 16g
    environment: { <<: *offline, VLLM_NO_USAGE_STATS: "1" }
    command: ["/models/hf/Qwen3.8-27B-FP8@017b9c7af6b5689d5dd426a76e0bc077eb5ca20a", "--served-model-name", "legal-llm",
              "--max-model-len", "${LGX_VLLM_MAX_LEN:-131072}",   # lowered to 65536 in M5 if KV capacity at 0.85 is short
              "--gpu-memory-utilization", "0.85",                  # leaves headroom for the TEI reranker on the same GPU
              "--enable-auto-tool-choice",
              "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3",   # [U] for Qwen3.8: verify in M5; fallback Qwen3.6-35B-A3B-FP8
              "--host", "0.0.0.0", "--port", "8000"]
    volumes: ["${LGX_HOME:-/opt/legilux}/models/hf:/models/hf:ro"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    networks: { backend: { aliases: [llm] } }

  # ------------------------------------------------------------------------------------------ UIs
  lgx-streamlit:                                        # tester UI (profile testui): chat + direct search + eval + corpus
    <<: *base
    profiles: [testui]
    image: lgx.local/lgx-streamlit:${LGX_PLATFORM:-2026.10.0}   # FROM python:3.13.16-slim-trixie@sha256:70729b46…
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *offline
      OPENAI_BASE_URL: "${LGX_LLM_BASE_URL:-http://llm:11434/v1}"   # Ollama /v1 | http://llm:8000/v1 (vLLM) | on-prem Mistral
      OPENAI_API_KEY_FILE: /run/secrets/llm_api_key
      LGX_LLM_MODEL: "${LGX_LLM_MODEL:-gemma4:26b-a4b}"
      LGX_LLM_PRESETS: "ollama,vllm,mistral-onprem"     # 'cloud' preset exists only in compose.dev.yml (opt-in)
      LGX_MCP_URL: http://mcp:8000/mcp
      LGX_MCP_TOKEN_FILE: /run/secrets/mcp_token
      LGX_MAX_TOOL_ITERATIONS: "5"
      LGX_MCP_TIMEOUT_S: "20"
      LGX_LLM_TIMEOUT_S: "${LGX_LLM_TIMEOUT_S:-120}"
      LGX_EVAL_DIR: /data/eval                          # gold sets shipped in the data bundle (read-only)
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_BROWSER_SERVER_ADDRESS: "${LGX_HOSTNAME:-legilux.intra}"
      STREAMLIT_LOGGER_HIDE_WELCOME_MESSAGE: "true"     # prevents the startup checkip.amazonaws.com lookup [V]
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "false"
    configs: [{ source: streamlit_config, target: /app/.streamlit/config.toml }]
    secrets: [mcp_token, llm_api_key]
    volumes: ["${LGX_HOME:-/opt/legilux}/bundles/current/eval:/data/eval:ro"]
    depends_on: { mcp: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      retries: 10
    networks: [backend, front]                          # internal only; users reach it through the proxy (basic auth)

  webui:                                                # OPTIONAL end-user UI (profile webui): accounts + chat history
    <<: *base
    profiles: [webui]
    image: lgx.local/open-webui:v0.12.3                 # ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1…
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]      # [U] image default user; documented in SECURITY.md
    env_file:                                           # WEBUI_SECRET_KEY + TOOL_SERVER_CONNECTIONS (holds the MCP token), 0600
      - { path: "${LGX_HOME:-/opt/legilux}/secrets/webui.env", required: false }   # lgx install --with webui writes it
    environment:
      <<: *offline
      OFFLINE_MODE: "true"                              # sets HF_HUB_OFFLINE, disables version check; does NOT block egress [V]
      ENABLE_PERSISTENT_CONFIG: "false"                 # env authoritative on every start [U behaviour; fallback provision job]
      WEBUI_URL: "https://${LGX_HOSTNAME:-legilux.intra}"
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: "pending"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_OTEL: "false"
      ENABLE_GOOGLE_DRIVE_INTEGRATION: "false"
      ENABLE_ONEDRIVE_INTEGRATION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"            # no Open WebUI RAG; retrieval is the MCP server's job
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
      WHISPER_MODEL_AUTO_UPDATE: "false"
      ENABLE_OLLAMA_API: "${LGX_OWUI_OLLAMA:-true}"
      OLLAMA_BASE_URL: "http://llm:11434"
      ENABLE_OPENAI_API: "${LGX_OWUI_OPENAI:-false}"    # true for gpu48 (vLLM) or the on-prem Mistral endpoint
      OPENAI_API_BASE_URL: "${LGX_OWUI_OPENAI_URL:-http://llm:8000/v1}"
      DEFAULT_MODELS: "${LGX_LLM_MODEL:-gemma4:26b-a4b}"
      ENABLE_TITLE_GENERATION: "${LGX_OWUI_AUX_GEN:-true}"         # false on cpu (saves 3–4 LLM calls per question)
      ENABLE_TAGS_GENERATION: "${LGX_OWUI_AUX_GEN:-true}"
      ENABLE_FOLLOW_UP_GENERATION: "${LGX_OWUI_AUX_GEN:-true}"
      ENABLE_AUTOCOMPLETE_GENERATION: "${LGX_OWUI_AUX_GEN:-true}"
    volumes: ["owui-data:/app/backend/data"]            # [U] data path, verified in M5
    depends_on: { mcp: { condition: service_healthy } }
    networks: [backend, front]                          # internal only; users reach it through the proxy

  proxy:                                                # the only published ports; starts only with a UI profile
    <<: *base
    profiles: [testui, webui]
    image: lgx.local/caddy:2.11.7-alpine                # caddy:2.11.7-alpine@sha256:d8542f48…
    cap_add: [NET_BIND_SERVICE]
    environment:
      LGX_HOSTNAME: "${LGX_HOSTNAME:-legilux.intra}"
      LGX_TESTUI_USER: "${LGX_TESTUI_USER:-tester}"
      LGX_TESTUI_BCRYPT: "${LGX_TESTUI_BCRYPT:?run lgx install or lgx dev-init (writes the bcrypt hash to deploy/.env)}"
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    ports: ["${LGX_BIND_ADDR:-127.0.0.1}:443:443", "${LGX_BIND_ADDR:-127.0.0.1}:8443:8443"]
    volumes: ["caddy-data:/data"]
    networks: [edge, front]

  # ------------------------------------------------------------------------------------------ audit / ops (optional)
  egress-sentinel:                                      # profile audit: compose.audit.yml points every service's dns: here
    <<: *base
    profiles: [audit]
    image: lgx.local/coredns:1.14.7                     # coredns/coredns:1.14.7@sha256:7efd3c63…
    read_only: true
    cap_add: [NET_BIND_SERVICE]
    command: ["-conf", "/etc/coredns/Corefile"]
    configs: [{ source: corefile, target: /etc/coredns/Corefile }]
    volumes: ["sentinel-log:/var/log/coredns"]
    networks:
      backend: { ipv4_address: 172.30.0.53 }
      front:   { ipv4_address: 172.30.2.53 }
      edge:    { ipv4_address: 172.30.1.53 }

  lgx-ctl:                                              # one-shot jobs: restore | smoke | provision | backup | eval | sentinel-report
    <<: *base                                           # (bridge packet capture for audit-egress runs in the host `lgx` script)
    profiles: [jobs]
    restart: "no"
    image: lgx.local/lgx-ctl:${LGX_PLATFORM:-2026.10.0}
    secrets: [pg_superuser_pw, pg_ro_pw, mcp_token]
    volumes: ["${LGX_HOME:-/opt/legilux}/bundles:/bundles:ro", "/var/backups/legilux:/backups",
              "sentinel-log:/sentinel:ro", "owui-data:/owui:ro"]   # owui-data: backup (host script stops webui first)
    networks: [backend]

  prometheus:                                           # optional; no Grafana (AGPL) in any default bundle
    <<: *base
    profiles: [observability]
    image: lgx.local/prometheus:v3.15.0-distroless      # prom/prometheus:v3.15.0-distroless@sha256:b2a413d5…
    read_only: true
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes: ["${LGX_HOME:-/opt/legilux}/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prom-data:/prometheus"]
    networks: [backend]

  db-bm25:                                              # lexical bake-off only (OD7); AGPL-3.0, needs legal sign-off
    <<: *base
    profiles: [bm25-agpl]
    image: lgx.local/paradedb:0.26.2-pg18               # paradedb/paradedb:0.26.2-pg18@sha256:c552094b…
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment: { POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_pw }
    secrets: [pg_superuser_pw]
    networks: [backend]

  oxigraph:                                             # optional SPARQL sidecar over a filtered N-Triples export
    <<: *base
    profiles: [rdf]
    image: lgx.local/oxigraph:0.5.11                    # ghcr.io/oxigraph/oxigraph:0.5.11 (digest resolved at build)
    read_only: true
    volumes: ["oxigraph-data:/data"]
    networks: [backend]

---
# =====================================================================================================
# deploy/compose.dev.yml — CONNECTED dev/test host overlay (Streamlit ON by default here). From deploy/:
#   make dev-init        # = lgx dev-init: writes deploy/.env (LGX_HOME=./.dev, LGX_TESTUI_BCRYPT, LGX_HOSTNAME=localhost),
#                        #   0600 secrets in deploy/.dev/secrets/, unpacks out/models-<profile>-<v>/ into deploy/.dev/models/
#                        #   and imports its Ollama store into the ollama-models volume (same path as the airgap install)
#   docker compose -f compose.yml -f compose.dev.yml --profile cpu --profile testui up -d
#   make dev-load T=<T>  # = lgx dev-load ../out/data-<T>/: pg_restore into the dev `db` + GRANTs + read-only flag, and
#                        #   links deploy/.dev/bundles/current -> ../out/data-<T> (eval gold sets); no signature check
# Streamlit and MCP are published on 127.0.0.1 without auth. Docker does not publish ports of containers that sit only
# on internal networks (tested 2026-10-16), so this overlay attaches mcp and lgx-streamlit to `edge`. The egress gates
# therefore run on the offline VM, not here. A cloud LLM is possible ONLY via the explicit `cloudllm` profile.
# =====================================================================================================
name: legilux

networks:
  dev-egress: {}                                        # internet-capable bridge, attached ONLY to lgx-streamlit-cloud

secrets:
  cloud_llm_api_key: { file: ../secrets/cloud_llm_api_key }   # repo-root secrets/ (gitignored, 0600); never in a bundle

services:
  mcp:
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend, edge]
  lgx-streamlit:
    ports: ["127.0.0.1:8501:8501"]
    networks: [backend, front, edge]
    environment:
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "true"
  lgx-streamlit-cloud:                                  # opt-in quick tests against a cloud OpenAI-compatible API
    extends: { file: compose.yml, service: lgx-streamlit }
    profiles: !override [cloudllm]                      # extends would otherwise merge to [testui, cloudllm] (lint-checked)
    ports: !override ["127.0.0.1:8502:8501"]
    environment:
      LGX_ALLOW_CLOUD_LLM: "1"                          # shows a red banner: questions + retrieved public texts leave the host
      OPENAI_BASE_URL: "${LGX_CLOUD_LLM_BASE_URL:-}"
      OPENAI_API_KEY_FILE: /run/secrets/cloud_llm_api_key
      LGX_LLM_MODEL: "${LGX_CLOUD_LLM_MODEL:-}"
      LGX_LLM_PRESETS: "cloud"
      NO_PROXY: "mcp,llm"
    secrets: !override [mcp_token, cloud_llm_api_key]
    networks: !override [backend, dev-egress]

---
# =====================================================================================================
# deploy/compose.build.yml — CONNECTED BUILD host (internet access, no GPU required). Run from the repository root;
# relative paths resolve against deploy/ (this file's directory), hence ../config, ../out and ../secrets.
#   make build-init   # writes secrets/pgbuild_pw (0600); secrets/ and out/ are gitignored
#   docker compose -f deploy/compose.build.yml run --rm builder lgx ingest --sample
#        dev / CI default: full SPARQL metadata (≈ 12 requests) + ≤ 300 file GETs; exempt from the nightly window,
#        not from the rate limits (≥ 1.2 s spacing, ≤ 2,000 requests/h)
#   docker compose -f deploy/compose.build.yml run --rm builder lgx ingest --full
#        operator step: ≈ 25k file GETs at ≥ 1.2 s and ≤ 2,000/h ≈ 12.5 h of fetching = ≈ 4 nightly windows
#        (01:00–05:00, resumable); `--ignore-window` runs it in one ≈ 13 h session with the same rate limits
#   docker compose -f deploy/compose.build.yml --profile embed run --rm embedder lgx embed --provider mistral-api
#        opt-in (OD3); needs secrets/mistral_api_key, which no other service mounts
# =====================================================================================================
name: legilux-build

volumes:
  pgbuild: {}
  cache: {}                                             # snapshots/, raw/, parsed/, chunks/, emb/ — build side only, never shipped

secrets:
  pgbuild_pw:      { file: ../secrets/pgbuild_pw }
  mistral_api_key: { file: ../secrets/mistral_api_key }  # build-side secret; only the `embedder` service; never in bundles or logs

services:
  pg-build:
    image: lgx.local/lgx-db:18-0.8.7-${LGX_PLATFORM:-2026.10.0}
    pull_policy: never
    environment: { POSTGRES_PASSWORD_FILE: /run/secrets/pgbuild_pw }
    secrets: [pgbuild_pw]
    volumes: ["pgbuild:/var/lib/postgresql"]
    command: ["postgres", "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=4"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 30 }

  builder:
    image: lgx.local/lgx-builder:${LGX_PLATFORM:-2026.10.0}   # FROM python:3.13.16-slim-trixie + lxml + poppler-utils (GPL, build only)
    pull_policy: never
    user: "10001:10001"
    environment:
      LGX_SPARQL_URL: https://data.legilux.public.lu/sparqlendpoint
      LGX_FILESTORE_BASE: https://legilux.public.lu/filestore/   # rewritten from http://data.legilux.public.lu/filestore/
      LGX_USER_AGENT: "LegiLux-Local-Clone/${LGX_PLATFORM:-2026.10.0} (+mailto:${LGX_OPERATOR_CONTACT:-ops@example.invalid}; <=1 req/s)"
      LGX_RATE_LIMIT_S: "1.2"
      LGX_MAX_REQ_PER_HOUR: "2000"
      LGX_MAX_REQ_PER_DAY: "30000"
      LGX_WINDOW: "01:00-05:00 Europe/Luxembourg"       # nightly sync and --full; --sample and --ignore-window bypass it
      LGX_PG_DSN: "host=pg-build user=postgres"
      LGX_PG_PASSWORD_FILE: /run/secrets/pgbuild_pw
      LGX_EMBED_PROVIDER: none                          # the embed stage runs only in `embedder`
    secrets: [pgbuild_pw]
    volumes: ["cache:/cache", "../config:/app/config:ro", "../out:/out"]
    depends_on: { pg-build: { condition: service_healthy } }

  embedder:                                             # opt-in (profile embed): the only service holding the Mistral API key
    extends: { service: builder }
    profiles: [embed]
    environment:
      LGX_EMBED_PROVIDER: mistral-api
      MISTRAL_API_KEY_FILE: /run/secrets/mistral_api_key
      LGX_MISTRAL_API_BASE: "${LGX_MISTRAL_API_BASE:-https://api.mistral.ai}"   # [U] host, verify in M3
    secrets: !override [pgbuild_pw, mistral_api_key]

---
# =====================================================================================================
# deploy/compose.audit.yml — egress audit overlay (`lgx audit-egress`, every platform bundle, PLAN §11.6):
#   docker compose -f compose.yml -f compose.audit.yml --profile <llm> --profile testui --profile audit up -d
# Docker's embedded DNS still resolves service names; every other lookup is forwarded to the sentinel, which
# logs it and answers NXDOMAIN. The host `lgx` script captures packets on br-lgx-back, br-lgx-front and br-lgx-edge
# (tcpdump on the host; containers cannot see the bridges). Pass: 0 external names in the sentinel log, 0 SYN out.
# =====================================================================================================
name: legilux

services:
  db:            { dns: [172.30.0.53] }
  mcp:           { dns: [172.30.0.53] }
  rerank:        { dns: [172.30.0.53] }
  llm-cpu:       { dns: [172.30.0.53] }
  llm-gpu:       { dns: [172.30.0.53] }
  llm-vllm:      { dns: [172.30.0.53] }
  lgx-streamlit: { dns: [172.30.0.53] }
  webui:         { dns: [172.30.0.53] }
  embed-local:   { dns: [172.30.0.53] }
  lgx-ctl:       { dns: [172.30.0.53] }
  prometheus:    { dns: [172.30.0.53] }
  oxigraph:      { dns: [172.30.0.53] }
  db-bm25:       { dns: [172.30.0.53] }
  proxy:         { dns: [172.30.1.53] }

---
# =====================================================================================================
# deploy/compose.enclave.yml — placement (ii): the user's Mistral on-prem embedder (and/or chat endpoint) runs on
# an enclave host. backend and front have no gateway, so mcp and lgx-streamlit also join `edge`; the DOCKER-USER
# ACCEPT for LGX_ENCLAVE_IP:LGX_ENCLAVE_PORT (see x-docker-user-rules) must be installed by `lgx install --enclave`.
# Placement (i) (profile embed-local, operator-supplied image on `backend`) is preferred.
# =====================================================================================================
name: legilux

services:
  mcp:
    networks: [backend, edge]
    environment:
      LGX_EMBED_PROVIDER: mistral-local
      LGX_EMBED_URL: "http://${LGX_ENCLAVE_IP:-192.0.2.10}:${LGX_ENCLAVE_PORT:-8080}/v1/embeddings"   # path per vendor docs [U]
      LGX_EMBED_MODEL: "${LGX_EMBED_MODEL:-mistral-embed-2312}"
  lgx-streamlit:
    networks: [backend, front, edge]

---
# =====================================================================================================
# deploy/compose.gpu48.yml — gpu48 overlay (added automatically by `lgx install --profile gpu48`):
#   docker compose -f compose.yml -f compose.gpu48.yml --profile gpu48 [--profile testui] [--profile webui] up -d
# Compose profiles cannot add a GPU reservation to an existing service, hence this overlay. TEI GPU images are built per
# GPU architecture [V TEI README]: LGX_TEI_TAG = 86-1.9.4 (A6000, A40, A10; sm_86) | 89-1.9.4 (L40S, RTX 6000 Ada; sm_89)
# | hopper-1.9.4 (H100). `lgx doctor` derives it from `nvidia-smi --query-gpu=compute_cap`; the gpu48 platform bundle
# carries the one matching image, its digest pinned per tag in images.lock (89-1.9.4@sha256:1a284d9c…).
# vLLM runs with --gpu-memory-utilization 0.85 (document 1) so the reranker fits on the same card.
# =====================================================================================================
name: legilux

services:
  rerank:
    image: lgx.local/tei:${LGX_TEI_TAG:?set by lgx install from the GPU compute capability}
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
