# Lawyer-curated abbreviations and acronyms for the citation resolver (PLAN §8.3, §6.3) -> lgx.act_alias.
# SEED ONLY: every entry is `reviewed: false` until a lawyer signs it off (M4, ≈ 2 lawyer-days).
# target = relative ELI of the jolux:ComplexWork that carries the text (codes are members of their base
# act, e.g. code/travail/* versions belong to work loi/2006/07/31/n2). Out-of-scope references (EU law)
# have no target but an `out_of_scope` reason so the resolver can answer "not covered" instead of guessing.
# Targets were checked against the frozen 2026-10-16 SPARQL snapshot (consolidation isMemberOf / act titles).
