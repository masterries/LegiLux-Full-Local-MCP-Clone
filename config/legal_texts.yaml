    de: "Quelle: Legilux (https://legilux.public.lu) – © Staatsministerium des Großherzogtums Luxemburg, Service central de législation – Lizenz CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Bearbeitete Texte (Extraktion, Aufteilung nach Artikeln, Indexierung); nicht amtliche lokale Kopie mit Stand {T}. Keine Billigung durch den SCL."
