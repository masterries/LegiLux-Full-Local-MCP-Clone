# Embedding stage (PLAN §6.5) — OFF by default (user decision): provider none computes and stores no vectors,
# vector_status = disabled:provider_none, retrieval runs lexical (+ reranker). Every key can be overridden by an
# LGX_EMBED_* variable (LGX_EMBED_PROVIDER, LGX_EMBED_BASE_URL, LGX_EMBED_MODEL, LGX_EMBED_MAX_CONCURRENCY,
# LGX_EMBED_COOLDOWN_S, LGX_EMBED_BATCH_SIZE, LGX_EMBED_TIMEOUT_S, LGX_EMBED_RETRIES, …; lgx_core.config.EMBED_ENV).
# The API key is never in this file: LGX_EMBED_API_KEY_FILE (a 0600 file / Docker secret) or LGX_EMBED_API_KEY (dev).
provider: none                   # none | mistral

# --- provider mistral: the Mistral embeddings API, POST {base_url}/v1/embeddings, Bearer key -------------------
# Same API on both sides; only the base URL differs: Mistral SaaS on the connected build side (documents, `lgx embed`)
# and the user's on-prem domain in the airgap (queries, lgx-mcp: LGX_EMBED_BASE_URL in deploy/.env).
base_url: https://api.mistral.ai
model: mistral-embed             # requested id; the id the API reports is recorded in lgx.embedding_model
dim: 1024                        # halfvec(1024) for the release (psql -v embed_dim)

# --- throughput limiter, shared by `lgx embed` (bulk) and the MCP server's query embedding ---------------------
# At most max_concurrency requests in flight; each request slot waits cooldown_s after its request completed
# before it is reused. Throughput <= max_concurrency x batch_size / (latency + cooldown_s) texts/s
# (5 x 64 / (2 s + 20 s) ≈ 14.5 texts/s; docs/dev/DEVELOPMENT.md § Embeddings).
max_concurrency: 5
cooldown_s: 20
batch_size: 64                   # texts per request
max_tokens_per_request: 16000    # [U] estimated tokens (chars / 3.5); a batch is split below it
timeout_s: 60                    # per request (lgx-mcp uses LGX_EMBED_TIMEOUT_S, 5 s in compose)
retries: 5                       # on 429 / 5xx / network errors, honouring Retry-After
backoff_s: [2, 4, 8, 16, 32]
retry_on_status: [429, 500, 502, 503, 504]

# --- startup probe of lgx-mcp: reported model id + dim must equal the release's lgx.embedding_model row; the
# probe text's vector must have cosine >= probe_min_cosine with the one recorded at build time.
probe_min_cosine: 0.99
