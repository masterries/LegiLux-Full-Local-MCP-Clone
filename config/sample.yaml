# Stratified dev/CI sample (PLAN §6.2, D13). Development NEVER runs the full crawl.
#
# `lgx ingest --sample` still pulls the FULL SPARQL metadata (selection must see all of it), then fetches
# only the files of the works below. Entries with `stage: m2` (PDF codes/consolidations) are selected but
# not fetched until M2 (`lgx fetch --include-m2`).
#
# Fields
#   work     relative ELI of the jolux:ComplexWork (the isMemberOf target; codes belong to their base act)
#   version  relative ELI of the version expected to serve at `snapshot_date` (role current or fallback)
#   extra_versions  other versions whose text is stored (e.g. the next version, role future)
#   group    core | code_recueil | consolidation | jo | parser_fixture | selection_fixture | metadata_only
#   expect   expected selection at `snapshot_date` on the frozen 2026-10-16 snapshot:
#            text_basis (exact), format (xml|html|pdf|none), flags (must be present; others may be added),
#            metadata_reason (exact, metadata_only only)
#   why      what the entry exercises
# Expectations were computed offline from the frozen research snapshot (a1, c1, c2, c3, m2, b1, l4, titles)
# by an M0 scratch script. If `lgx select` disagrees, triage the rule or the expectation — never edit
# silently. With a live T other than 2026-10-16 some expectations may legitimately drift.
# No personal-data acts (naturalisation laws) are sampled.
version: 1
snapshot_date: 2026-10-16
description: ~50 works over codes, consolidations by type, JO originals (CC-BY XML and CC-BY HTML paths), parser and selection fixtures.
